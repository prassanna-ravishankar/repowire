site_name: Repowire
site_description: Local-first mesh for live AI coding-agent sessions across Claude Code, Codex, Gemini CLI, OpenCode, Pi, and human control surfaces.
site_url: https://docs.repowire.io/
repo_url: https://github.com/prassanna-ravishankar/repowire
repo_name: prassanna-ravishankar/repowire
edit_uri: edit/main/docs/
copyright: MIT licensed.

docs_dir: docs
site_dir: site

# Fail the build on broken links, missing nav entries, or duplicate slugs.
strict: true

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo-mark.svg
  favicon: assets/favicon.ico
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - stylesheets/repowire-cobalt.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: material/transit-connection-variant
      link: https://repowire.io/dashboard
      name: Relay dashboard
    - icon: fontawesome/brands/github
      link: https://github.com/prassanna-ravishankar/repowire
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/repowire/

