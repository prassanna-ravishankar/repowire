site_name: Repowire
site_description: Local-first mesh for live AI coding-agent sessions across Claude Code, Codex, Gemini CLI, OpenCode, Pi, and human control surfaces.
site_url: https://docs.repowire.io/
repo_url: https://github.com/prassanna-ravishankar/repowire
repo_name: prassanna-ravishankar/repowire
edit_uri: edit/main/docs/
copyright: MIT licensed.

docs_dir: docs
site_dir: site

# Fail the build on broken links, missing nav entries, or duplicate slugs.
strict: true

theme:
  name: material
  language: en
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  logo: assets/logo-mark-copper.svg
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - stylesheets/copper-mesh.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/prassanna-ravishankar/repowire
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/repowire/

