<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Repowire architecture</title>
  <desc id="desc">Coding agents and human control surfaces connect through a local Repowire daemon, with an optional relay for remote access.</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#287a78"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b75b36"/>
    </marker>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17343a; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #17343a; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2.3px; text-transform: uppercase; }
      .title { font-size: 29px; font-weight: 760; }
      .body { font-size: 18px; font-weight: 560; }
      .small { font-size: 15px; font-weight: 520; }
      .inverse { fill: #fffaf0; }
      .mint { fill: #95cfbf; }
      .orange { fill: #b75b36; }
      .connector { fill: none; stroke: #287a78; stroke-width: 3; marker-end: url(#arrow-teal); }
      .connector-active { fill: none; stroke: #b75b36; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f3eddf"/>
  <path d="M45 72 H1155" stroke="#d7cdbb" stroke-width="2"/>
  <text x="48" y="49" class="label eyebrow" fill="#287a78">LOCAL-FIRST AGENT MESH</text>

  <rect x="44" y="105" width="326" height="512" rx="18" fill="#fffaf0" stroke="#b7aa93" stroke-width="2"/>
  <text x="76" y="148" class="label eyebrow">AGENT RUNTIMES</text>

  <g transform="translate(72 178)">
    <rect width="270" height="78" rx="12" fill="#e1efeb" stroke="#287a78" stroke-width="2"/>
    <text x="20" y="32" class="label body">Claude Code</text>
    <text x="20" y="57" class="mono small">hooks + native inbox</text>
  </g>
  <g transform="translate(72 272)">
    <rect width="270" height="78" rx="12" fill="#e1efeb" stroke="#287a78" stroke-width="2"/>
    <text x="20" y="32" class="label body">Codex</text>
    <text x="20" y="57" class="mono small">App Server + MCP</text>
  </g>
  <g transform="translate(72 366)">
    <rect width="270" height="78" rx="12" fill="#fff3df" stroke="#b75b36" stroke-width="2"/>
    <text x="20" y="32" class="label body">OpenCode</text>
    <text x="20" y="57" class="mono small">plugin + WebSocket</text>
  </g>
  <g transform="translate(72 460)">
    <rect width="270" height="78" rx="12" fill="#fff3df" stroke="#b75b36" stroke-width="2"/>
    <text x="20" y="32" class="label body">Pi</text>
    <text x="20" y="57" class="mono small">extension + WebSocket</text>
  </g>

  <rect x="438" y="193" width="324" height="334" rx="22" fill="#17343a"/>
  <text x="476" y="241" class="label eyebrow mint">LOCAL DAEMON · :8377</text>
  <text x="476" y="286" class="label title inverse">Repowire</text>
  <path d="M476 307 H724" stroke="#446168" stroke-width="2"/>
  <text x="476" y="350" class="mono body inverse">peer registry</text>
  <text x="476" y="389" class="mono body inverse">transport router</text>
  <text x="476" y="428" class="mono body inverse">asks · jobs · sessions</text>
  <text x="476" y="467" class="mono body inverse">SQLite state · HTTP MCP</text>

  <rect x="830" y="105" width="326" height="240" rx="18" fill="#fffaf0" stroke="#b7aa93" stroke-width="2"/>
  <text x="862" y="148" class="label eyebrow">HUMAN SURFACES</text>
  <text x="862" y="197" class="label body">Dashboard</text>
  <text x="862" y="238" class="label body">Telegram</text>
  <text x="862" y="279" class="label body">Slack</text>
  <text x="862" y="316" class="mono small">service peers on the mesh</text>

  <rect x="830" y="401" width="326" height="216" rx="18" fill="#fff3df" stroke="#b75b36" stroke-width="2"/>
  <text x="862" y="444" class="label eyebrow orange">OPTIONAL REMOTE PATH</text>
  <text x="862" y="492" class="label title">Hosted relay</text>
  <text x="862" y="532" class="label body">remote dashboard</text>
  <text x="862" y="568" class="label body">cross-machine bridge</text>

  <path d="M370 360 H425" class="connector"/>
  <text x="380" y="341" class="mono small">WS</text>
  <path d="M762 271 H817" class="connector"/>
  <text x="773" y="252" class="mono small">HTTP</text>
  <path d="M762 461 H817" class="connector-active"/>
  <text x="772" y="442" class="mono small orange">relay</text>

  <text x="48" y="682" class="label body">The daemon is the only hub. Transports stay client-side.</text>
  <text x="48" y="716" class="mono small">identity = peer_id · addressing = display_name · relay = optional</text>
</svg>
