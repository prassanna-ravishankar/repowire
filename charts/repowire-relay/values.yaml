replicaCount: 1

image:
  repository: us-docker.pkg.dev/baldmaninc/gcr.io/repowire-relay
  tag: latest
  pullPolicy: Always

service:
  port: 80
  targetPort: 8000

relay:
  host: "0.0.0.0"
  port: 8000

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Use spot instances for cost savings
nodeSelector:
  cloud.google.com/gke-spot: "true"

tolerations:
  - effect: NoSchedule
    key: cloud.google.com/gke-spot
    operator: Equal
    value: "true"

# HTTPRoute configuration
httpRoute:
  enabled: true
  hostnames:
    - relay.repowire.io
  gatewayNamespace: clusterkit
  gatewayName: clusterkit-gateway
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"

# MCP OAuth grants must survive restarts. One relay owns the SQLite volume.
oauth:
  enabled: true
  issuer: "https://relay.repowire.io"
  storage: "1Gi"
  storageClassName: ""
  # Hosted workflow explicitly selects gclb; self-hosters ignore proxy headers.
  proxyMode: "direct"
  gclbForwardingIP: ""

# Repowire Managed control plane. Name an existing Secret to enable it; every
# key is optional and the managed/admin APIs answer 503 until managed-url and
# managed-control-token are set. Keys: managed-url, managed-control-token,
# managed-users and admin-users (comma-separated relay user ids allowed to use
# managed; admins also see /admin), cf-account-id,
# cf-analytics-token (Account Analytics Read, for actual spend).
managed:
  secretName: ""
