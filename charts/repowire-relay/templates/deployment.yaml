{{- if and .Values.oauth.enabled (ne (int .Values.replicaCount) 1) }}
{{- fail "OAuth uses a single SQLite owner; replicaCount must be 1" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.oauth.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- if .Values.oauth.enabled }}
      securityContext:
        fsGroup: 10001
      volumes:
      - name: oauth-state
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-oauth
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: relay
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.relay.port }}
        command: ["repowire", "relay", "start", "--host", "{{ .Values.relay.host }}", "--port", "{{ .Values.relay.port }}"]
        {{- if .Values.oauth.enabled }}
        env:
        - name: REPOWIRE_RELAY_OAUTH_ISSUER
          value: {{ required "oauth.issuer is required" .Values.oauth.issuer | quote }}
        - name: REPOWIRE_RELAY_OAUTH_DB
          value: /data/oauth.db
        - name: REPOWIRE_RELAY_OAUTH_PROXY_MODE
          value: {{ .Values.oauth.proxyMode | quote }}
        {{- if eq .Values.oauth.proxyMode "gclb" }}
        - name: REPOWIRE_RELAY_OAUTH_GCLB_FORWARDING_IP
          value: {{ required "oauth.gclbForwardingIP is required in gclb mode" .Values.oauth.gclbForwardingIP | quote }}
        {{- end }}
        volumeMounts:
        - name: oauth-state
          mountPath: /data
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.relay.port }}
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.relay.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
