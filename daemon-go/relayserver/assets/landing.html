  <title>Repowire</title>
  <style>
    :root { color-scheme: dark; --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1); }
    * { box-sizing: border-box; }
    body { font: 16px system-ui; background: #0a0a0f; color: #c8c8d0; display: grid; place-items: center; min-height: 100svh; margin: 0; padding: 32px 20px; }
    .card { width: min(440px, 100%); text-align: center; }
    .relay-mark { display: block; width: 240px; height: 210px; max-width: 100%; margin: 0 auto 12px; color: #e0e0e7; }
    h1 { margin: 0 0 12px; font-size: 28px; font-weight: 600; letter-spacing: -.04em; }
    .tagline { margin: 0 0 28px; color: #92929f; }
    form { display: flex; gap: 8px; }
    input, button { font: inherit; padding: .7rem; border: 1px solid #30303f; border-radius: 6px; background: #14141f; color: inherit; }
    input { flex: 1; min-width: 0; }
    button { cursor: pointer; padding-inline: 20px; }
    :focus-visible { outline: 2px solid #b6b6d0; outline-offset: 3px; }
    .error { color: #f08080; }
    .hint { color: #92929f; margin: 20px 0 28px; }
    a { color: #9292c0; text-underline-offset: 3px; }
    .links { margin: 0; font-size: 14px; }
  </style>
</head>

    <h1>repowire</h1>
    <p class="tagline">Mesh network for AI coding agents</p>
    <form action="/auth" method="post">
      <input name="token" aria-label="Relay key" placeholder="rw_…" autocomplete="off" autocapitalize="none" spellcheck="false">
      <button>Open</button>
    </form>
    {{ERROR}}
    <p class="hint"><small>Run <code>repowire setup --relay</code> to get your key.</small></p>
    <p class="links"><a href="https://docs.repowire.io/">Docs</a> · <a href="https://github.com/prassanna-ravishankar/repowire">GitHub</a></p>
  </main>
  <script>
    (() => {
      const motion = matchMedia('(prefers-reduced-motion: reduce)');
      if (motion.matches || !Element.prototype.animate) return;
      const mark = document.querySelector('.relay-mark');
      const dots = [...mark.querySelectorAll('circle')];
      const easing = getComputedStyle(document.documentElement).getPropertyValue('--ease-in-out').trim();
      const animations = [];
      // A Fibonacci sphere gives each peer its own orbit, with no random jumps.
      // Keep the same dots for the entire reveal; their resting positions are the R.
      dots.forEach((dot, index) => {
        const latitude = 1 - 2 * (index + .5) / dots.length;
        const ring = Math.sqrt(1 - latitude * latitude);
        const longitude = index * Math.PI * (3 - Math.sqrt(5));
        const targetX = Number(dot.getAttribute('cx'));
        const targetY = Number(dot.getAttribute('cy'));
        const frames = [];
        for (let step = 0; step <= 12; step++) {
          const phase = step / 12;
          const angle = longitude + phase * .85;
          const x = ring * Math.cos(angle);
          const depth = ring * Math.sin(angle);
          // A slight tilt keeps the globe from reading as horizontal rows.
          const orbX = 120 + 74 * (x * .966 + latitude * .259);
          const orbY = 105 + 74 * (x * .259 - latitude * .966);
          frames.push({
            offset: phase * .48,
            transform: 'translate(' + (orbX - targetX) + 'px,' + (orbY - targetY) + 'px)',
            opacity: .35 + .65 * (depth + 1) / 2,
            easing: step === 12 ? easing : 'linear'
          });
        }
        frames.push({ offset: 1, transform: 'translate(0px,0px)', opacity: 1 });
        const animation = dot.animate(frames, { duration: 3200, easing: 'linear' });
        animation.onfinish = () => animation.cancel();
        animations.push(animation);
      });
      const settle = () => animations.forEach(animation => animation.cancel());
      motion.addEventListener('change', event => { if (event.matches) settle(); });
      // Pause in a hidden tab; there is no idle animation or recurring timer.
      document.addEventListener('visibilitychange', () => {
        animations.forEach(animation => {
          if (document.hidden && animation.playState === 'running') animation.pause();
          else if (!document.hidden && animation.playState === 'paused') animation.play();
        });
      });
      if (document.hidden) animations.forEach(animation => animation.pause());
      window.addEventListener('pagehide', settle, { once: true });
    })();
  </script>
