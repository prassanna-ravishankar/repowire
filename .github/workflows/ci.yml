name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Lint
        run: uvx ruff check repowire/

      - name: Type check
        run: uvx mypy repowire/ --ignore-missing-imports

      - name: Test
        run: |
          uv sync --extra dev
          uv run pytest
