name: Publish native release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon-go/go.mod
          cache-dependency-path: daemon-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Go
        run: cd daemon-go && go vet ./... && go test -race ./...

      - name: Verify and build dashboard
        run: cd web && npm ci && npm test -- --run && npm run build

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            stage=$(mktemp -d)
            mkdir -p "$stage/web"
            cp -R web/out "$stage/web/out"
            (
              cd daemon-go
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags="-s -w -X github.com/repowire/repowire/daemon-go/cli.Version=$version" \
                -o "$stage/repowire" .
            )
            tar -C "$stage" -czf "dist/repowire_${version}_${os}_${arch}.tar.gz" repowire web
            rm -rf "$stage"
          done
          cp install.sh dist/install.sh
          cd dist
          sha256sum repowire_*.tar.gz install.sh > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  homebrew:
    name: Bump Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Require tap deploy key
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY secret is missing; the release is published but the Homebrew tap was not bumped." >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          repository: prassanna-ravishankar/homebrew-repowire
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Rewrite formula from release checksums
        env:
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          curl -fsSL -o checksums.txt "https://github.com/${SOURCE_REPO}/releases/download/${GITHUB_REF_NAME}/checksums.txt"
          python3 - "$version" <<'PY'
          import re, sys
          version = sys.argv[1]
          shas = {line.split()[1]: line.split()[0] for line in open("checksums.txt") if line.strip()}
          path = "Formula/repowire.rb"
          formula = open(path).read()
          for target in ("darwin_arm64", "darwin_amd64", "linux_arm64", "linux_amd64"):
              archive = f"repowire_{version}_{target}.tar.gz"
              sha = shas.get(archive) or sys.exit(f"missing checksum for {archive}")
              pattern = re.compile(
                  r'(url "https://github\.com/[^"]+/releases/download/)v[0-9.]+/repowire_[0-9.]+_' + target + r'\.tar\.gz"(\s*sha256 ")[0-9a-f]+"')
              formula, n = pattern.subn(rf'\g<1>v{version}/{archive}"\g<2>{sha}"', formula)
              if n != 1:
                  sys.exit(f"expected one {target} url/sha256 pair in {path}, found {n}")
          open(path, "w").write(formula)
          PY
          rm checksums.txt
          git diff --stat
      - name: Commit and push
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/repowire.rb
          git diff --cached --quiet && { echo "formula already at $version"; exit 0; }
          git commit -m "repowire $version"
          git push origin HEAD:main
