# Only the manifests that ship: the web dashboard (static export) and the Go
# daemon/relay/bridges. Python was removed in #382.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (via eslint-config-next) supports TypeScript < 6.1;
      # on 7.x ESLint stops with "typescript-eslint does not support TS 7.0"
      # (#499). Drop this once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node types follow the runtime floor (engines >=22, node:22 images),
      # not the newest Node; bump with the runtime.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: gomod
    directory: /daemon-go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
