server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "interest-cohort=()" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Cache-Control "no-cache" always;

  location = /health {
    access_log off;
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # Next.js static export emits page.html for routes; serve them
  # transparently for both /page and /page/ variants.
  location / {
    try_files $uri $uri.html $uri/index.html $uri/ =404;
  }

  location /_next/static/ {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
